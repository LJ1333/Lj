<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية Casio fx-991EX Style</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.3.0/math.js"></script>

    <style>
        /* ------------------------------------- */
        /* التنسيقات العامة */
        /* ------------------------------------- */

        /* المتغيرات (Variables) */
        :root {
            --primary-color: #007bff;        
            --secondary-color: #28a745;      /* أخضر */
            --background-light: #f8f9fa;     
            --text-dark: #343a40;           
            --card-background: #ffffff;      
            --border-color: #dee2e6;         
            --header-bg-color: #1a1a2e;      
            --header-text-color: #ffffff;   

            /* المتغيرات الخاصة بالحاسبة */
            --calculator-bg: #e0e0e0;       /* لون جسم الحاسبة */
            --screen-bg: #cff0cc;           /* لون شاشة العرض فاتح */
            --input-color: #101010;         /* لون إدخال */
            --result-color: #28a745;        /* لون النتيجة (أخضر) */
            --key-normal-bg: #ffffff;       /* مفاتيح الأرقام */
            --key-function-bg: #f0f0f0;     /* مفاتيح الوظائف */
            --key-special-bg: #f9d8a5;      /* مفاتيح العمليات */
            --key-shift-bg: #fff0d8;        /* مفاتيح SHIFT و ALPHA */
            --key-shift-color: #ff0000;     /* لون نص SHIFT */
            --key-alpha-color: #0056b3;     /* لون نص ALPHA */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light); 
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2rem;
        }
        
        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: bold;
            transition: color 0.3s;
            display: block; 
            text-align: right;
            width: 90%;
            max-width: 450px;
        }
        .back-link:hover {
            color: #0056b3; 
        }

        /* ------------------------------------- */
        /* تنسيق الآلة الحاسبة */
        /* ------------------------------------- */

        .calculator-container {
            width: 90%;
            max-width: 450px;
            background-color: var(--calculator-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        .screen {
            background-color: var(--screen-bg);
            padding: 15px 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.1);
        }

        .input-display, .result-display {
            direction: ltr; /* الإظهار من اليسار لليمين */
            text-align: right;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0;
        }
        
        .input-display {
            min-height: 30px;
            color: var(--input-color);
            font-size: 1.4rem;
        }

        .result-display {
            min-height: 25px;
            color: var(--result-color);
            font-size: 1.1rem;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .key {
            padding: 15px 5px;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.05s;
            line-height: 1.2;
            min-width: 0;
            position: relative;
        }

        .key:active {
            transform: scale(0.98);
        }

        /* تنسيقات خاصة للمفاتيح */
        
        /* مفاتيح الأرقام */
        .key-digit {
            background-color: var(--key-normal-bg);
            color: var(--input-color);
            font-size: 1.1rem;
        }
        
        /* مفاتيح الوظائف الرئيسية (sin, log, etc) */
        .key-function {
            background-color: var(--key-function-bg);
            color: var(--text-dark);
            font-size: 0.95rem;
        }
        
        /* مفاتيح العمليات (=, +, - , x, ÷) و AC, DEL */
        .key-operator, .key-action {
            background-color: var(--key-special-bg);
            color: var(--text-dark);
        }

        .key-action.AC {
            background-color: #ff5757; /* أحمر لـ AC */
            color: white;
        }
        .key-action.DEL {
            background-color: #ff9933; /* برتقالي لـ DEL */
            color: white;
        }
        
        .key-operator.equals {
            background-color: #007bff; /* أزرق لـ = */
            color: white;
        }

        /* مفاتيح SHIFT و ALPHA */
        .key-mode {
            background-color: var(--key-shift-bg);
            font-size: 0.75rem;
            padding: 10px 5px;
        }

        .key-mode.shift {
            color: var(--key-shift-color);
        }

        .key-mode.alpha {
            color: var(--key-alpha-color);
        }

        /* تنسيق النص الثانوي (SHIFT & ALPHA) */
        .secondary-text {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.65rem;
            pointer-events: none; /* لمنع تداخل الضغط */
        }

        .secondary-text.shift {
            color: var(--key-shift-color);
        }

        .secondary-text.alpha {
            top: 15px; 
            right: 4px;
            font-size: 0.65rem;
            color: var(--key-alpha-color);
        }

        /* حالة التفعيل لـ SHIFT و ALPHA */
        .key-mode.active {
            outline: 3px solid rgba(0, 0, 0, 0.5); 
            box-shadow: 0 0 0 3px white, 0 0 0 5px currentColor;
        }

        /* تنسيق الشاشات الصغيرة */
        @media (max-width: 400px) {
            .key {
                padding: 12px 3px;
                font-size: 0.8rem;
            }
            .key-mode {
                padding: 8px 3px;
                font-size: 0.7rem;
            }
        }

        /* ------------------------------------- */
        /* تنسيق الـ Modal (وضع الحاسبة) */
        /* ------------------------------------- */
        
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4); 
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            text-align: right;
        }

        .modal-content h2 {
            text-align: center;
            color: var(--header-bg-color);
        }

        .mode-option {
            padding: 10px;
            margin: 5px 0;
            background-color: #f1f1f1;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        .mode-option:hover {
            background-color: #ddd;
        }

        .mode-option.active-mode {
            background-color: var(--primary-color);
            color: white;
        }

        .close-button {
            color: #aaa;
            float: left;
            font-size: 28px;
            font-weight: bold;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <header class="main-header">
        <h1>🔢 الآلة الحاسبة العلمية (Casio Style)</h1>
    </header>

    <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>

    <div class="calculator-container">
        <div class="screen">
            <div id="inputDisplay" class="input-display"></div>
            <div id="resultDisplay" class="result-display">0</div>
        </div>

        <div class="keypad" id="keypad">
            <button class="key key-mode shift" data-value="shift">
                SHIFT
                <span class="secondary-text alpha">Alpha</span>
            </button>
            <button class="key key-function" data-value="open-mode-modal">MODE</button>
            <button class="key key-function" data-value="fact">
                <span class="secondary-text shift">nCr</span>
                <span class="secondary-text alpha">nPr</span>
                x!
            </button>
            <button class="key key-function" data-value="abs(">
                <span class="secondary-text shift">RND</span>
                Abs
            </button>
            <button class="key key-action DEL" data-value="DEL">DEL</button>
            <button class="key key-action AC" data-value="AC">AC</button>

            <button class="key key-function" data-value="ln(">
                <span class="secondary-text shift">exp(</span>
                ln(
            </button>
            <button class="key key-function" data-value="log(">
                <span class="secondary-text shift">10^</span>
                log(
            </button>
            <button class="key key-function" data-value="x²">
                <span class="secondary-text shift">sqrt(</span>
                x²
            </button>
            <button class="key key-function" data-value="^">
                <span class="secondary-text shift">nroot(</span>
                xʸ
            </button>
            <button class="key key-function" data-value="(">(</button>
            <button class="key key-function" data-value=")">)</button>

            <button class="key key-function" data-value="sin(">
                <span class="secondary-text shift">asin(</span>
                sin(
            </button>
            <button class="key key-function" data-value="cos(">
                <span class="secondary-text shift">acos(</span>
                cos(
            </button>
            <button class="key key-function" data-value="tan(">
                <span class="secondary-text shift">atan(</span>
                tan(
            </button>
            <button class="key key-function" data-value="π">π</button>
            <button class="key key-function" data-value="e">e</button>
            <button class="key key-operator divide" data-value="/">÷</button>
            
            <button class="key key-digit" data-value="7">7</button>
            <button class="key key-digit" data-value="8">8</button>
            <button class="key key-digit" data-value="9">9</button>
            <button class="key key-function" data-value="x⁻¹">
                <span class="secondary-text shift">fact(</span>
                x⁻¹
            </button>
            <button class="key key-function" data-value="E">ENG</button>
            <button class="key key-operator multiply" data-value="*">×</button>

            <button class="key key-digit" data-value="4">4</button>
            <button class="key key-digit" data-value="5">5</button>
            <button class="key key-digit" data-value="6">6</button>
            <button class="key key-function" data-value="ans">ANS</button>
            <button class="key key-function" data-value="R->P">R▶P</button>
            <button class="key key-operator subtract" data-value="-">-</button>

            <button class="key key-digit" data-value="1">1</button>
            <button class="key key-digit" data-value="2">2</button>
            <button class="key key-digit" data-value="3">3</button>
            <button class="key key-function" data-value="comma">,</button>
            <button class="key key-function" data-value="STO">STO</button>
            <button class="key key-operator add" data-value="+">+</button>

            <button class="key key-digit" data-value="0">0</button>
            <button class="key key-digit" data-value=".">.</button>
            <button class="key key-function" data-value="+/-">(-)</button>
            <button class="key key-function" data-value="space">SPC</button>
            <button class="key key-function" data-value="alpha">Alpha</button>
            <button class="key key-operator equals" data-value="=">=</button>
        </div>
    </div>
    
    <div id="modeModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModeModal()">&times;</span>
            <h2>وضع الزاوية</h2>
            <div id="degModeOption" class="mode-option" data-mode="deg">1. Deg (درجات)</div>
            <div id="radModeOption" class="mode-option" data-mode="rad">2. Rad (راديان)</div>
        </div>
    </div>


    <script>
        const inputDisplay = document.getElementById('inputDisplay');
        const resultDisplay = document.getElementById('resultDisplay');
        const keypad = document.getElementById('keypad');
        const modeModal = document.getElementById('modeModal');
        const shiftKey = document.querySelector('.key-mode.shift');
        const alphaKey = document.querySelector('.key-mode.alpha');

        let isShiftActive = false;
        let isAlphaActive = false;
        let angleMode = 'deg'; // deg | rad
        let lastResult = 0;
        let lastInput = '';

        // -------------------------------------
        // وظائف وضع الزاوية (Degree/Radian)
        // -------------------------------------

        function openModeModal() {
            modeModal.style.display = 'flex';
            document.getElementById('degModeOption').classList.toggle('active-mode', angleMode === 'deg');
            document.getElementById('radModeOption').classList.toggle('active-mode', angleMode === 'rad');
        }

        function closeModeModal() {
            modeModal.style.display = 'none';
        }

        function setAngleMode(mode) {
            angleMode = mode;
            closeModeModal();
            // يمكنك إضافة مؤشر في الشاشة هنا إذا أردت
            console.log(`Angle mode set to: ${angleMode}`);
        }
        
        document.getElementById('degModeOption').onclick = () => setAngleMode('deg');
        document.getElementById('radModeOption').onclick = () => setAngleMode('rad');
        
        // -------------------------------------
        // وظائف التحكم بـ SHIFT و ALPHA
        // -------------------------------------

        function toggleShift() {
            isShiftActive = !isShiftActive;
            shiftKey.classList.toggle('active', isShiftActive);
            // إلغاء تفعيل Alpha عند تفعيل Shift
            if (isShiftActive && isAlphaActive) {
                isAlphaActive = false;
                alphaKey.classList.remove('active');
            }
        }

        function toggleAlpha() {
            isAlphaActive = !isAlphaActive;
            alphaKey.classList.toggle('active', isAlphaActive);
             // إلغاء تفعيل Shift عند تفعيل Alpha
            if (isAlphaActive && isShiftActive) {
                isShiftActive = false;
                shiftKey.classList.remove('active');
            }
        }

        // -------------------------------------
        // وظائف الإدخال والتحويل
        // -------------------------------------
        
        // تحويل تعابير الآلة الحاسبة إلى تعابير math.js
        function sanitizeInput(expression) {
            let sanitized = expression.replace(/×/g, '*')
                                    .replace(/÷/g, '/')
                                    .replace(/Ans/g, lastResult)
                                    .replace(/fact/g, 'factorial')
                                    .replace(/Abs/g, 'abs')
                                    .replace(/log\(/g, 'log10(') // math.js uses log for natural log, log10 for base 10
                                    .replace(/exp\(/g, 'e^(')
                                    .replace(/^(-)/, '0$1'); // للتعامل مع (-1) في البداية

            // تحويل الوظائف المثلثية بناءً على وضع الزاوية
            if (angleMode === 'deg') {
                sanitized = sanitized.replace(/([a]?sin|cos|tan)\(([^)]+)\)/g, (match, func, val) => {
                    const radians = `${val} * pi / 180`;
                    return `${func}(${radians})`;
                });
            }
            
            return sanitized;
        }

        function appendInput(value) {
            if (value === 'space') {
                value = ' ';
            }
            if (value === 'ANS') {
                value = 'ans';
            }
            inputDisplay.textContent += value;
            lastInput = inputDisplay.textContent;
            
            // إلغاء تفعيل وضع SHIFT/ALPHA بعد الإدخال
            if (isShiftActive) toggleShift();
            if (isAlphaActive) toggleAlpha();
        }

        function calculate() {
            let expression = inputDisplay.textContent;
            
            if (!expression) {
                resultDisplay.textContent = 0;
                lastResult = 0;
                return;
            }

            try {
                const safeExpression = sanitizeInput(expression);
                let result = math.evaluate(safeExpression);
                
                // تنسيق النتيجة
                resultDisplay.textContent = result.toFixed(10).replace(/\.?0+$/, ''); 
                lastResult = result;
                
                // مسح الإدخال بعد النتيجة
                inputDisplay.textContent = '';
                
            } catch (error) {
                resultDisplay.textContent = 'Syntax Error';
            }
        }
        
        function clearInput(type) {
            if (type === 'AC') {
                inputDisplay.textContent = '';
                resultDisplay.textContent = 0;
                lastResult = 0;
            } else if (type === 'DEL') {
                inputDisplay.textContent = inputDisplay.textContent.slice(0, -1);
            }
            lastInput = inputDisplay.textContent;
        }

        function handleSignChange() {
            const currentInput = inputDisplay.textContent;
            const lastNumRegex = /([0-9\.]+)$|(\([\-]*[0-9\.]+\))$/; // يجد آخر رقم أو قوس
            const match = currentInput.match(lastNumRegex);

            if (match) {
                const lastPart = match[0];
                const newPart = currentInput.replace(lastPart, `(-${lastPart})`);
                inputDisplay.textContent = newPart;
            } else if (currentInput === '') {
                 appendInput('(-');
            } else {
                 appendInput('(-'); // إذا لم يجد رقم، يضيف بداية قوس سالب
            }
        }
        
        // -------------------------------------
        // مستمع الأحداث (Event Listener)
        // -------------------------------------

        keypad.addEventListener('click', (e) => {
            if (!e.target.classList.contains('key')) return;

            const value = e.target.getAttribute('data-value');

            switch (value) {
                case 'AC':
                case 'DEL':
                    clearInput(value);
                    break;
                case '=':
                    calculate();
                    break;
                case 'shift':
                    toggleShift();
                    break;
                case 'alpha':
                    toggleAlpha();
                    break;
                case 'open-mode-modal':
                    openModeModal();
                    break;
                case '+/-':
                    handleSignChange();
                    break;
                
                // الوظائف المثلثية (تتأثر بـ SHIFT)
                case 'sin(':
                case 'cos(':
                case 'tan(':
                    const trigFunc = isShiftActive ? `a${value}` : value;
                    appendInput(trigFunc); 
                    break;
                
                // وظائف القوى والجذور (تتأثر بـ SHIFT)
                case 'log(': 
                    const logFunc = isShiftActive ? '10^(' : 'log(';
                    appendInput(logFunc);
                    break;
                case 'ln(': 
                    const lnFunc = isShiftActive ? 'exp(' : 'ln(';
                    appendInput(lnFunc);
                    break;
                case 'x⁻¹': 
                    const invFunc = isShiftActive ? 'fact(' : '^(-1)';
                    appendInput(invFunc);
                    break;
                    
                case 'x²':
                    const sqFunc = isShiftActive ? 'sqrt(' : '^2';
                    appendInput(sqFunc);
                    break;
                
                case '^':
                    const powFunc = isShiftActive ? 'nthRoot(' : '^';
                    appendInput(powFunc);
                    break;
                
                case 'comma':
                    // لإدخال الثوابت (في وضع ALPHA) أو الفاصلة (في الوضع العادي)
                    const commaValue = isAlphaActive ? 'e' : ',';
                    appendInput(commaValue);
                    break;
                    
                case 'E':
                    // (في وضع ALPHA) أو ENG (في الوضع العادي)
                    const engValue = isAlphaActive ? 'e' : 'e'; // تبسيط
                    appendInput(engValue);
                    break;
                
                default:
                    // الأرقام والعمليات العادية والثوابت (π, e, Ans)
                    appendInput(value);
                    break;
            }
        });
    </script>
</body>
</html>
