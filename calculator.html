<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية Casio fx-991EX Style</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.3.0/math.js"></script>

    <style>
        :root {
            --header-bg-color: #1a1a2e;
            --header-text-color: #ffffff;
            --primary-color: #007bff;
            /* ألوان Casio fx-991EX */
            --casio-frame-color: #333;
            --casio-key-base: #f7f7f7;
            --casio-key-num: #e0e0e0;
            --casio-key-func: #c0c0c0;
            --casio-key-op: #a0a0a0;
            --casio-screen-bg: #e0eee0;
            --casio-shift-color: #007bff; /* أزرق */
            --casio-alpha-color: #f44336; /* أحمر */

            /* الألوان المضافة لتحسين المظهر */
            --color-ac: #e74c3c; /* أحمر للـ AC */
            --color-del: #f39c12; /* برتقالي للـ DEL */
            --color-operator: #2ecc71; /* أخضر للعمليات */
            --color-equal: #00bcd4; /* أزرق سماوي لـ = */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f5;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 10vh;
            flex-direction: column;
            width: 100%;
        }
        
        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 
                         0 0 10px rgba(0, 123, 255, 0.5); 
            color: #fff;
        }
        
        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #0056b3;
        }

        /* تنسيقات الآلة الحاسبة */
        .calculator {
            border: 1px solid var(--casio-frame-color);
            border-radius: 12px;
            width: 500px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background-color: var(--casio-frame-color);
            padding: 15px;
            margin-bottom: 30px; 
        }

        /* شاشة العرض */
        .calculator-screen {
            width: 100%;
            height: 90px;
            background-color: var(--casio-screen-bg);
            color: #333;
            text-align: right;
            padding: 10px;
            font-size: 1.4rem;
            border: 1px solid #aaa;
            box-sizing: border-box;
            border-radius: 5px;
            margin-bottom: 15px;
            direction: ltr; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        #status-indicators {
            font-size: 0.8rem; 
            color: #555;
            text-align: left;
            height: 15px;
        }

        #expression {
            font-size: 1.2rem;
            min-height: 20px;
        }

        #result {
            font-size: 2.2rem;
            font-weight: bold;
            color: #004d99;
            min-height: 35px;
        }

        /* تخطيط الأزرار: 7 أعمدة */
        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-gap: 5px;
        }
        
        button {
            height: 45px;
            background-color: var(--casio-key-num);
            border: none;
            border-radius: 3px;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            transition: background-color 0.1s;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.85;
        }

        /* الأزرار العلوية (SH/AL) */
        .top-key {
            background-color: var(--casio-key-base);
            color: black;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .active-shift {
            background-color: var(--casio-shift-color) !important;
            color: white !important;
        }
        
        .active-alpha {
            background-color: var(--casio-alpha-color) !important;
            color: white !important;
        }

        /* الألوان الجديدة للأزرار */
        .control-key[value="all-clear"] {
            background-color: var(--color-ac);
            color: white;
            font-weight: bold;
        }
        .control-key[value="delete"] {
            background-color: var(--color-del);
            color: white;
            font-weight: bold;
        }
        
        .operator {
            background-color: var(--color-operator);
            color: white;
            font-weight: bold;
        }

        /* الأزرار البرتقالية (الـ Scientific Keys في FX-991EX) */
        .scientific-key {
            background-color: var(--casio-key-func);
            color: black;
            font-size: 0.9rem;
            font-weight: normal;
        }
        
        /* زر يساوي */
        .equal-sign {
            background-color: var(--color-equal);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* تنسيقات نافذة MODE */
        #modeModal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .mode-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px; 
            text-align: center;
        }

        .mode-box h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .mode-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-button {
            padding: 10px 5px;
            background-color: #eee;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: left;
        }
        
        .mode-button span {
             font-weight: bold;
             color: #007bff;
             margin-right: 5px;
        }

        .mode-button:hover {
            background-color: #e0e0e0;
            transform: translateY(-1px);
        }
        
        /* النافذة الترحيبية */
        .welcome-box { background-color: #fff; padding: 30px 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; width: 90%; max-width: 400px; border: 3px solid #007bff; animation: fadeIn 0.5s; }
        .welcome-box p { font-size: 1.5rem; font-weight: bold; color: #1a1a2e; margin-bottom: 25px; }
        .continue-button { padding: 12px 30px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: background-color 0.3s; }
        .continue-button:hover { background-color: #0056b3; }
        .modal-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body onload="openWelcomeModal(); updateStatusDisplay();">
    
    <div class="main-header">
        <h1>الآلة الحاسبة العلمية Casio fx-991EX 📐</h1>
    </div>

    <div id="welcomeModal" class="modal-overlay">
        <div class="welcome-box">
            <p>طبعاً كلو شغلي مش زي بعض الناس 😉</p>
            <button class="continue-button" onclick="closeWelcomeModal()">أكمل</button>
        </div>
    </div>
    
    <div id="modeModal">
        <div class="mode-box">
            <h2>اختيار وضع الحاسبة (MODE)</h2>
            <div class="mode-options">
                <button class="mode-button" onclick="setCalculatorMode('COMP')"><span>1:</span> COMP (حساب)</button>
                <button class="mode-button" onclick="setCalculatorMode('STAT')"><span>2:</span> STAT (إحصاء)</button>
                <button class="mode-button" onclick="setCalculatorMode('TABLE')"><span>3:</span> TABLE (جدول)</button>
                <button class="mode-button" onclick="setCalculatorMode('EQN')"><span>4:</span> EQN (معادلات)</button>
                <button class="mode-button" onclick="setCalculatorMode('BASE-N')"><span>5:</span> BASE-N (قاعدة-N)</button>
                <button class="mode-button" onclick="setCalculatorMode('VECTOR')"><span>6:</span> VECTOR (متجهات)</button>
                <button class="mode-button" onclick="setCalculatorMode('MATRIX')"><span>7:</span> MATRIX (مصفوفات)</button>
                <button class="mode-button" onclick="setCalculatorMode('Ratio')"><span>8:</span> Ratio (نسبة)</button>
                <button class="mode-button" onclick="setCalculatorMode('Inequality')"><span>9:</span> Inequality (متباينة)</button>
                <button class="mode-button" onclick="setCalculatorMode('DIST')"><span>10:</span> DIST (توزيع)</button>
                <button class="mode-button" onclick="setCalculatorMode('DEG')"><span>11:</span> DEG (درجات)</button>
                <button class="mode-button" onclick="setCalculatorMode('RAD')"><span>12:</span> RAD (راديان)</button>
                <button class="mode-button" onclick="setCalculatorMode('GRAD')"><span>13:</span> GRAD (جريديان)</button>
            </div>
            <button class="continue-button" style="margin-top: 15px;" onclick="closeModeModal()">إغلاق النافذة</button>
        </div>
    </div>
    
    <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>

    <div class="calculator">
        <div class="calculator-screen">
            <div id="status-indicators"></div> 
            <div id="expression"></div>
            <div id="result">0</div>
        </div>
        
        <div class="calculator-keys">
            
            <button id="shift-key" class="top-key" value="shift" title="وظيفة ثانوية">SHIFT</button>
            <button id="alpha-key" class="top-key" value="alpha" title="أحرف ومتغيرات">ALPHA</button>
            <button id="mode-key" class="scientific-key" value="open-mode-modal">MODE</button>
            <button class="scientific-key" value="setup" title="SHIFT+MODE">SETUP</button>
            <button class="scientific-key" value="on-off" title="تشغيل/إيقاف">ON</button>
            <button class="control-key" value="delete">DEL</button>
            <button class="control-key" value="all-clear">AC</button>
            
            <button id="sin-key" class="scientific-key" value="sin(" title="SHIFT+sin: sin⁻¹">sin</button>
            <button id="cos-key" class="scientific-key" value="cos(" title="SHIFT+cos: cos⁻¹">cos</button>
            <button id="tan-key" class="scientific-key" value="tan(" title="SHIFT+tan: tan⁻¹">tan</button>
            <button class="scientific-key" value="hyp" title="دالة زائفة">hyp</button>
            <button class="scientific-key" value="Pol(" title="SHIFT+Rec: إحداثيات ديكارتية">Pol</button>
            <button class="scientific-key" value="^">xʸ</button>
            <button class="scientific-key" value="sqrt(">√</button>

            <button class="scientific-key" value="log(" title="SHIFT+log: 10^x">log</button>
            <button class="scientific-key" value="ln(" title="SHIFT+ln: e^x">ln</button>
            <button class="scientific-key" value="exp" title="SHIFT+exp: e">eˣ</button>
            <button class="scientific-key" value="Abs(" title="القيمة المطلقة">Abs</button>
            <button class="scientific-key" value="Eng" title="الهندسية">ENG</button>
            <button class="scientific-key" value="(">(</button>
            <button class="scientific-key" value=")">)</button>
            
            <button class="scientific-key" value="x⁻¹" title="SHIFT+x⁻¹: Fact!">x⁻¹</button>
            <button class="scientific-key" value="x²" title="SHIFT+x²: جذر تربيعي">x²</button>
            <button class="scientific-key" value="fact" title="x!">nPr</button>
            <button class="scientific-key" value="deg-min-sec" title="º ’ ”">º ”</button>
            <button class="scientific-key" value="STO" title="تخزين (ALPHA+STO: متغيرات)">STO</button>
            <button class="scientific-key" value="RCL" title="استدعاء (ALPHA+RCL: متغيرات)">RCL</button>
            <button class="scientific-key" value="CALC" title="حل معادلات">CALC</button>
            
            <button value="7">7</button>
            <button value="8">8</button>
            <button value="9">9</button>
            <button class="operator" value="/">÷</button>
            <button class="operator" value="*">&times;</button>
            <button class="scientific-key" value="S<=>D" title="تحويل عشري/كسري">S<=>D</button>
            <button class="scientific-key" value="Ans" title="النتيجة الأخيرة">Ans</button>

            <button value="4">4</button>
            <button value="5">5</button>
            <button value="6">6</button>
            <button class="operator" value="-">-</button>
            <button class="operator" value="+">+</button>
            <button class="scientific-key" value="Exp" title="أس 10 (E)">EXP</button>
            <button class="scientific-key" value="rnd" title="تقريب">Rnd</button>
            
            <button value="1">1</button>
            <button value="2">2</button>
            <button value="3">3</button>
            <button class="scientific-key" value="pi">π</button>
            <button class="scientific-key" value="e">e</button>
            <button class="scientific-key" value="comma">,</button>
            <button class="scientific-key" value="mod" title="باقي القسمة">Mod</button>

            <button value="0" class="span-2">0</button>
            <button class="decimal" value=".">.</button>
            <button class="scientific-key" value="minus-sign" title="تغيير الإشارة">(-)</button>
            <button class="equal-sign span-3" value="=">=</button>
        </div>
    </div>
    
    <script>
        // *************** متغيرات الآلة الحاسبة ***************
        let expressionDisplay = document.getElementById('expression');
        let resultDisplay = document.getElementById('result');
        let currentExpression = '';
        let isResultDisplayed = false;
        const welcomeModal = document.getElementById('welcomeModal');
        const modeModal = document.getElementById('modeModal'); 
        let lastAnswer = 0; // لتخزين آخر نتيجة (Ans)
        
        // *************** متغيرات حالة SHIFT, ALPHA, MODE ***************
        let isShiftActive = false;
        let isAlphaActive = false;
        let calculatorMode = 'COMP'; // الوضع الافتراضي
        let angleMode = 'DEG'; // وضع الزاوية الافتراضي

        // *************** وظائف الـ Modal ***************
        function openWelcomeModal() {
            welcomeModal.style.display = 'flex';
        }
        
        function closeWelcomeModal() {
            welcomeModal.style.display = 'none';
        }

        function openModeModal() {
            modeModal.style.display = 'flex';
            isShiftActive = false;
            isAlphaActive = false;
            updateStatusDisplay();
        }
        
        function closeModeModal() {
            modeModal.style.display = 'none';
        }

        function setCalculatorMode(mode) {
            // يتم تغيير مؤشر الزاوية فقط لهذه الأوضاع
            if (['DEG', 'RAD', 'GRAD'].includes(mode)) {
                angleMode = mode;
            } 
            // يتم تغيير وضع الحساب الرئيسي للأوضاع الأخرى
            else {
                calculatorMode = mode;
            }
            
            closeModeModal();
            updateStatusDisplay();
        }

        // *************** وظيفة تحديث حالة الشاشة ***************
        function updateStatusDisplay() {
            const indicator = document.getElementById('status-indicators');
            const shiftButton = document.getElementById('shift-key');
            const alphaButton = document.getElementById('alpha-key');
            
            let statusText = '';
            
            // مؤشر SHIFT
            if (isShiftActive) {
                statusText += '<span style="color: var(--casio-shift-color); margin-right: 10px;">S</span>';
                shiftButton.classList.add('active-shift');
            } else {
                shiftButton.classList.remove('active-shift');
            }
            
            // مؤشر ALPHA
            if (isAlphaActive) {
                statusText += '<span style="color: var(--casio-alpha-color); margin-right: 10px;">A</span>';
                alphaButton.classList.add('active-alpha');
            } else {
                alphaButton.classList.remove('active-alpha');
            }
            
            // مؤشر MODE و Angle Mode
            statusText += `<span style="color: #555; margin-left: 10px;">${calculatorMode}</span>`;
            
            if (angleMode !== 'COMP') { 
                statusText += `<span style="color: #555;">${angleMode}</span>`;
            }
            
            indicator.innerHTML = statusText;
            
            // تحديث محتوى الأزرار الثانوية (HTML الداخلي)
            document.getElementById('sin-key').innerHTML = isShiftActive ? '<span style="color: var(--casio-shift-color); font-size: 0.7rem;">sin⁻¹</span><br>sin' : 'sin';
            document.getElementById('cos-key').innerHTML = isShiftActive ? '<span style="color: var(--casio-shift-color); font-size: 0.7rem;">cos⁻¹</span><br>cos' : 'cos';
            document.getElementById('tan-key').innerHTML = isShiftActive ? '<span style="color: var(--casio-shift-color); font-size: 0.7rem;">tan⁻¹</span><br>tan' : 'tan';

        }

        // *************** تعديل Math.js لدمج Angle Mode ***************
        const originalMathEvaluate = math.evaluate;

        math.evaluate = (expr) => {
            let scope = {
                'pi': Math.PI,
                'e': Math.E,
                'Ans': lastAnswer,
            };
            
            // التحقق من وضع الزاوية
            const degToRad = (x) => x * (Math.PI / 180);
            const radToDeg = (x) => x * (180 / Math.PI);
            const gradToRad = (x) => x * (Math.PI / 200);
            
            // دوال مثلثية تدعم الأوضاع المختلفة
            let sinFunc, cosFunc, tanFunc;

            if (angleMode === 'RAD') {
                sinFunc = Math.sin;
                cosFunc = Math.cos;
                tanFunc = Math.tan;
                scope.asin = Math.asin;
                scope.acos = Math.acos;
                scope.atan = Math.atan;
            } else if (angleMode === 'GRAD') {
                sinFunc = (x) => Math.sin(gradToRad(x));
                cosFunc = (x) => Math.cos(gradToRad(x));
                tanFunc = (x) => Math.tan(gradToRad(x));
                scope.asin = (x) => radToDeg(Math.asin(x)) * 200 / 180;
                scope.acos = (x) => radToDeg(Math.acos(x)) * 200 / 180;
                scope.atan = (x) => radToDeg(Math.atan(x)) * 200 / 180;
            } else { // DEG (الافتراضي)
                sinFunc = (x) => Math.sin(degToRad(x));
                cosFunc = (x) => Math.cos(degToRad(x));
                tanFunc = (x) => Math.tan(degToRad(x));
                scope.asin = (x) => radToDeg(Math.asin(x));
                scope.acos = (x) => radToDeg(Math.acos(x));
                scope.atan = (x) => radToDeg(Math.atan(x));
            }
            
            scope.sin = sinFunc;
            scope.cos = cosFunc;
            scope.tan = tanFunc;
            
            let cleanExpr = expr
                .replace(/fact/g, '!'); 
            
            return originalMathEvaluate(cleanExpr, scope);
        };

        // *************** وظائف الإدخال والحساب ***************
        function updateDisplays() {
            // استبدال الرموز البرمجية بالرموز الرياضية للعرض
            expressionDisplay.textContent = currentExpression
                .replace(/\*/g, '×')
                .replace(/\//g, '÷')
                .replace(/\^/g, 'ˣ')
                .replace(/asin\(/g, 'sin⁻¹(')
                .replace(/acos\(/g, 'cos⁻¹(')
                .replace(/atan\(/g, 'tan⁻¹(')
                .replace(/fact/g, '!')
                .replace(/STO/g, 'STO')
                .replace(/RCL/g, 'RCL')
                .replace(/CALC/g, 'CALC');
        }

        function appendInput(value) {
            
            // إلغاء حالة SHIFT و ALPHA بعد استخدام وظيفة ثانوية
            if (isShiftActive || isAlphaActive) {
                 isShiftActive = false;
                 isAlphaActive = false;
                 updateStatusDisplay();
            }
            
            if (isResultDisplayed) {
                // إذا كانت الشاشة تعرض نتيجة، ابدأ بتعبير جديد إلا إذا كان المدخل عملية حسابية
                if (!['+', '-', '*', '/', '^', '(', ')', 'fact', 'log(', 'ln('].includes(value) && !value.match(/^(sin|cos|tan)\(/)) {
                    currentExpression = '';
                } else if (['+', '-', '*', '/', '^'].includes(value)) {
                    // إذا كان المدخل عملية حسابية، فاستخدم النتيجة السابقة كبداية للتعبير
                    currentExpression = String(lastAnswer);
                } else {
                    currentExpression = '';
                }
                isResultDisplayed = false;
            }
            
            // التعامل مع الإدخال
            if (value === 'pi') {
                 currentExpression += 'pi';
            } else if (value === 'e') {
                 currentExpression += 'e';
            } else if (value === 'minus-sign') {
                currentExpression += '-';
            } else if (value === 'Ans') {
                currentExpression += 'Ans';
            }
            // التعامل مع الأصفار الابتدائية
            else if (currentExpression === '' && value === '0') {
                 return;
            }
            // التعامل مع الإدخال العادي
            else {
                currentExpression += value;
            }
            
            resultDisplay.textContent = ''; 
            updateDisplays();
        }

        function calculate() {
            if (currentExpression === '') return;
            
            // منع الحساب إذا كان التعبير يحتوي على وظائف غير مدعومة رياضياً (فقط تعرض على الشاشة)
            if (currentExpression.includes('CALC') || currentExpression.includes('STO') || currentExpression.includes('RCL')) {
                 resultDisplay.textContent = 'Syntax Error';
                 isResultDisplayed = true;
                 return;
            }

            try {
                let result = math.evaluate(currentExpression);
                
                if (typeof result === 'number' && !isFinite(result)) {
                    resultDisplay.textContent = 'Error';
                } else {
                    resultDisplay.textContent = String(result);
                    lastAnswer = result; // حفظ النتيجة في Ans
                    currentExpression = String(result); 
                }
                isResultDisplayed = true;
                
            } catch (e) {
                resultDisplay.textContent = 'Syntax Error';
                isResultDisplayed = true;
            }
            updateDisplays();
        }

        function resetCalculator() {
            currentExpression = '';
            resultDisplay.textContent = '0';
            isResultDisplayed = false;
            updateDisplays();
        }
        
        function deleteLast() {
            if (isResultDisplayed) return;
            currentExpression = currentExpression.slice(0, -1);
            if (currentExpression === '') {
                resultDisplay.textContent = '0';
            }
            updateDisplays();
        }

        // *************** ربط الأزرار ***************
        const keys = document.querySelector('.calculator-keys');
        keys.addEventListener('click', (event) => {
            const { target } = event;
            const { value } = target;

            if (!target.matches('button')) { return; }

            switch (value) {
                case '=':
                    calculate();
                    break;
                case 'all-clear':
                    resetCalculator();
                    break;
                case 'delete':
                    deleteLast();
                    break;
                
                case 'shift':
                    isAlphaActive = false; // إلغاء Alpha
                    isShiftActive = !isShiftActive;
                    updateStatusDisplay();
                    break;
                case 'alpha':
                    isShiftActive = false; // إلغاء Shift
                    isAlphaActive = !isAlphaActive;
                    updateStatusDisplay();
                    break;
                case 'open-mode-modal':
                    openModeModal();
                    break;
                
                // الوظائف المثلثية (تتأثر بـ SHIFT)
                case 'sin(':
                case 'cos(':
                case 'tan(':
                    const funcPrefix = isShiftActive ? `a${value}` : value;
                    appendInput(funcPrefix); 
                    break;
                
                // وظائف القوى والجذور (تتأثر بـ SHIFT)
                case 'log(': 
                    const logFunc = isShiftActive ? '10^(' : 'log(';
                    appendInput(logFunc);
                    break;
                case 'ln(': 
                    const lnFunc = isShiftActive ? 'exp(' : 'ln(';
                    appendInput(lnFunc);
                    break;
                case 'x⁻¹': 
                    const invFunc = isShiftActive ? 'fact' : '^(-1)';
                    appendInput(invFunc);
                    break;
                case 'x²': 
                    const sqFunc = isShiftActive ? 'sqrt(' : '^(2)';
                    appendInput(sqFunc);
                    break;
                case '^': 
                    const powFunc = isShiftActive ? 'sqrt(' : '^'; 
                    appendInput(powFunc);
                    break;
                case 'exp': 
                    const expFunc = isShiftActive ? 'e' : 'exp(';
                    appendInput(expFunc);
                    break;

                // الأزرار التي تعرض رموزاً لكنها لا تنفذ منطقاً معقداً
                case 'STO':
                case 'RCL':
                case 'CALC':
                case 'setup':
                case 'hyp':
                case 'S<=>D':
                case 'on-off':
                case 'Pol(':
                case 'Abs(':
                case 'Eng':
                case 'fact':
                case 'deg-min-sec':
                case 'Exp':
                case 'rnd':
                case 'comma':
                case 'mod':
                    appendInput(value);
                    break;

                // الإدخال العادي
                default:
                    appendInput(value);
            }
        });
        
        // *************** التهيئة الأولية ***************
        updateDisplays();
    </script>
</body>
</html>
