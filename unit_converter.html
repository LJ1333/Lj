<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول القياسات - ليث</title>
    <style>
        /* ------------------------------------- */
        /* التنسيقات العامة */
        /* ------------------------------------- */

        /* المتغيرات (Variables) - افتراضية */
        :root {
            --primary-color: #007bff;        /* أزرق ساطع */
            --secondary-color: #9c27b0;      /* بنفسجي للمحول */
            --background-light: #f8f9fa;     /* خلفية فاتحة جداً */
            --text-dark: #343a40;            /* نص داكن */
            --header-bg-color: #1a1a2e;       /* لون خلفية الشريط العلوي (داكن عميق) */
            --header-text-color: #ffffff;    /* لون نص الشريط العلوي */
        }

        /* 💻 تنسيق الجسم */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light); 
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: bold;
            transition: color 0.3s;
            display: block; 
            text-align: right;
            width: 90%;
            max-width: 500px;
        }
        .back-link:hover {
            color: #0056b3; 
        }
        
        .container {
            max-width: 500px;
            width: 90%;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* ------------------------------------- */
        /* تنسيقات محول القياسات */
        /* ------------------------------------- */

        .converter-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .converter-group label, .unit-label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .converter-select, .unit-input, .unit-select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .unit-select {
            cursor: pointer;
            background-color: #f9f9f9;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-row > div {
            flex: 1;
        }

        .convert-button {
            padding: 15px 30px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 15px;
            width: 100%;
        }

        .convert-button:hover {
            background-color: #7b1fa2;
        }

        .result-section {
            margin-top: 25px;
            border-top: 2px solid var(--secondary-color);
            padding-top: 15px;
        }

        .result-section h3 {
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 1.4rem;
        }

        .result-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--secondary-color);
            display: block;
        }
        
    </style>
</head>
<body>
    <header class="main-header">
        <h1>📐 محول القياسات</h1>
    </header>

    <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>

    <div class="container">
        
        <div class="converter-group">
            <label for="converterType">اختر نوع القياس:</label>
            <select id="converterType" class="converter-select" onchange="initializeUnits()">
                <option value="length">الطول</option>
                <option value="weight">الوزن</option>
                <option value="temperature">الحرارة</option>
            </select>
        </div>

        <div class="converter-group">
            <label for="inputValue">القيمة:</label>
            <input type="number" id="inputValue" class="unit-input" placeholder="أدخل القيمة" value="1">
        </div>
        
        <div class="input-row">
            <div>
                <label for="fromUnit" class="unit-label">من وحدة:</label>
                <select id="fromUnit" class="unit-select"></select>
            </div>
            <div>
                <label for="toUnit" class="unit-label">إلى وحدة:</label>
                <select id="toUnit" class="unit-select"></select>
            </div>
        </div>

        <button class="convert-button" onclick="convertUnit()">
            تحويل
        </button>

        <div class="result-section">
            <h3>النتيجة:</h3>
            <span id="resultValue" class="result-value">0</span>
        </div>
    </div>


    <script>
        const unitData = {
            length: {
                referenceUnit: 'meter', // الوحدة المرجعية للتحويل
                units: {
                    meter: { name: 'متر', factor: 1 },
                    kilometer: { name: 'كيلومتر', factor: 1000 },
                    centimeter: { name: 'سنتيمتر', factor: 0.01 },
                    millimeter: { name: 'مليمتر', factor: 0.001 },
                    inch: { name: 'إنش', factor: 0.0254 },
                    foot: { name: 'قدم', factor: 0.3048 },
                    yard: { name: 'ياردة', factor: 0.9144 }
                }
            },
            weight: {
                referenceUnit: 'kilogram', // الوحدة المرجعية للتحويل
                units: {
                    kilogram: { name: 'كيلوغرام', factor: 1 },
                    gram: { name: 'غرام', factor: 0.001 },
                    milligram: { name: 'مليغرام', factor: 0.000001 },
                    pound: { name: 'رطل', factor: 0.453592 },
                    ounce: { name: 'أونصة', factor: 0.0283495 }
                }
            },
            temperature: {
                // ليس لها عامل ضرب ثابت (تحويل خطي مختلف)
                units: {
                    celsius: { name: 'سيلسيوس' },
                    fahrenheit: { name: 'فهرنهايت' },
                    kelvin: { name: 'كلفن' }
                }
            }
        };

        const converterTypeSelect = document.getElementById('converterType');
        const fromUnitSelect = document.getElementById('fromUnit');
        const toUnitSelect = document.getElementById('toUnit');
        const inputValue = document.getElementById('inputValue');
        const resultValue = document.getElementById('resultValue');

        // -------------------------------------
        // وظائف تهيئة الوحدات
        // -------------------------------------

        function initializeUnits() {
            const type = converterTypeSelect.value;
            const units = unitData[type].units;

            // مسح الخيارات القديمة
            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';

            // ملء قوائم الاختيار بالوحدات الجديدة
            for (const key in units) {
                const name = units[key].name;

                const fromOption = document.createElement('option');
                fromOption.value = key;
                fromOption.textContent = name;
                fromUnitSelect.appendChild(fromOption);

                const toOption = document.createElement('option');
                toOption.value = key;
                toOption.textContent = name;
                toUnitSelect.appendChild(toOption);
            }
            
            // تعيين الافتراضيات
            if (type === 'length') {
                fromUnitSelect.value = 'meter';
                toUnitSelect.value = 'kilometer';
            } else if (type === 'weight') {
                fromUnitSelect.value = 'kilogram';
                toUnitSelect.value = 'gram';
            } else if (type === 'temperature') {
                fromUnitSelect.value = 'celsius';
                toUnitSelect.value = 'fahrenheit';
            }
            
            // مسح النتيجة عند التغيير
            resultValue.textContent = '0';
            inputValue.value = 1;
        }

        // -------------------------------------
        // وظائف التحويل
        // -------------------------------------

        function convertUnit() {
            const type = converterTypeSelect.value;
            const fromUnit = fromUnitSelect.value;
            const toUnit = toUnitSelect.value;
            let value = parseFloat(inputValue.value);

            if (isNaN(value)) {
                resultValue.textContent = '0';
                return;
            }

            let result;

            if (type === 'temperature') {
                // التحويل الخاص لدرجات الحرارة (ليس عاملاً ثابتاً)
                
                // 1. تحويل القيمة الأصلية إلى سيلسيوس (C) أولاً
                let celsiusValue = value;
                if (fromUnit === 'fahrenheit') {
                    celsiusValue = (value - 32) * 5 / 9;
                } else if (fromUnit === 'kelvin') {
                    celsiusValue = value - 273.15;
                }

                // 2. تحويل قيمة سيلسيوس (C) إلى الوحدة المطلوبة (toUnit)
                if (toUnit === 'fahrenheit') {
                    result = (celsiusValue * 9 / 5) + 32;
                } else if (toUnit === 'kelvin') {
                    result = celsiusValue + 273.15;
                } else { // إلى سيلسيوس
                    result = celsiusValue;
                }
                
            } else {
                // تحويل القياسات القياسية (الطول والوزن) باستخدام الوحدة المرجعية
                const units = unitData[type].units;
                const referenceUnit = unitData[type].referenceUnit;
                
                // 1. تحويل القيمة الأصلية إلى الوحدة المرجعية (المتر أو الكيلوغرام)
                const fromFactor = units[fromUnit].factor;
                const valueInReference = value * fromFactor;

                // 2. تحويل القيمة المرجعية إلى الوحدة المطلوبة
                const toFactor = units[toUnit].factor;
                result = valueInReference / toFactor;
            }

            // عرض النتيجة
            resultValue.textContent = result.toFixed(4);
        }

        // تهيئة الوحدات عند تحميل الصفحة
        window.onload = initializeUnits;

    </script>
</body>
</html>
