<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات - ليث</title>
    <style>
        /* ------------------------------------- */
        /* التنسيقات العامة */
        /* ------------------------------------- */

        /* المتغيرات (Variables) - افتراضية */
        :root {
            --primary-color: #007bff;        /* أزرق ساطع */
            --secondary-color: #ff9800;      /* برتقالي/ذهبي للمحول */
            --background-light: #f0f0f5;     /* خلفية فاتحة جداً */
            --text-dark: #343a40;            /* نص داكن */
            --header-bg-color: #1a1a2e;       /* لون خلفية الشريط العلوي (داكن عميق) */
            --header-text-color: #ffffff;    /* لون نص الشريط العلوي */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light);
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            color: var(--text-dark);
        }

        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: bold;
            transition: color 0.3s;
            display: block; 
            text-align: right;
            width: 90%;
            max-width: 600px;
        }
        .back-link:hover {
            color: #0056b3; 
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* ------------------------------------- */
        /* تنسيقات محول العملات */
        /* ------------------------------------- */

        .input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .input-group label {
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .currency-input, .currency-select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .currency-select {
            cursor: pointer;
            background-color: #f9f9f9;
        }

        .result-section {
            margin-top: 30px;
            border-top: 2px solid var(--secondary-color);
            padding-top: 20px;
        }

        .result-section h3 {
            color: var(--secondary-color);
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--secondary-color);
            display: block;
        }
        
        .convert-button {
            padding: 15px 30px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .convert-button:hover {
            background-color: #e68900;
        }
        
        .swap-button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 15px 0;
            cursor: pointer;
            transition: color 0.3s, transform 0.3s;
        }
        
        .swap-button:hover {
            color: #0056b3;
            transform: rotate(180deg);
        }

        /* ------------------------------------- */
        /* تنسيقات الـ Modal (ملاحظة تحديث الأسعار) */
        /* ------------------------------------- */
        
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); 
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            float: left;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <h1>💰 محول العملات</h1>
    </header>

    <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>

    <div class="container">
        
        <div class="input-group">
            <label for="currencyInput">المبلغ:</label>
            <input type="number" id="currencyInput" class="currency-input" placeholder="أدخل المبلغ" value="1" min="0">
        </div>

        <div class="input-group">
            <label for="fromCurrency">من عملة:</label>
            <select id="fromCurrency" class="currency-select"></select>
        </div>
        
        <button class="swap-button" onclick="swapCurrencies()">🔄</button>

        <div class="input-group">
            <label for="toCurrency">إلى عملة:</label>
            <select id="toCurrency" class="currency-select"></select>
        </div>

        <button class="convert-button" onclick="convertCurrency()">
            تحويل
        </button>

        <div class="result-section">
            <h3>النتيجة:</h3>
            <span id="currencyResultValue" class="result-value">0</span>
        </div>
    </div>
    
    <div id="checkModal" class="modal-overlay">
        <div class="modal-box">
            <span class="close-btn" onclick="closeCheckModal()">&times;</span>
            <h2>ملاحظة مهمة</h2>
            <p style="color: #dc3545; font-weight: bold;">⚠️ أسعار الصرف ثابتة ومحددة مسبقاً في الكود.</p>
            <p>لا يتم تحديثها من الإنترنت، لذا استخدم المحول كأداة تدريبية فقط.</p>
        </div>
    </div>


    <script>
        // قاعدة بيانات أسعار الصرف مقابل الدولار الأمريكي (USD)
        // (افتراضية لأغراض التدريب)
        const exchangeRates = {
            'USD': 1.0000, 
            'JOD': 0.7090, // الدينار الأردني
            'EUR': 0.9200, // اليورو
            'GBP': 0.8000, // الجنيه الاسترليني
            'SAR': 3.7500, // الريال السعودي
            'AED': 3.6700, // الدرهم الإماراتي
            'EGP': 47.7000, // الجنيه المصري
            'JPY': 155.000, // الين الياباني
            'CAD': 1.3600, // الدولار الكندي
            'AUD': 1.5000, // الدولار الأسترالي
        };

        const currencyNames = {
            'USD': 'دولار أمريكي (USD)',
            'JOD': 'دينار أردني (JOD)',
            'EUR': 'يورو (EUR)',
            'GBP': 'جنيه استرليني (GBP)',
            'SAR': 'ريال سعودي (SAR)',
            'AED': 'درهم إماراتي (AED)',
            'EGP': 'جنيه مصري (EGP)',
            'JPY': 'ين ياباني (JPY)',
            'CAD': 'دولار كندي (CAD)',
            'AUD': 'دولار أسترالي (AUD)',
        };

        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const currencyInputValue = document.getElementById('currencyInput');
        const currencyResultValue = document.getElementById('currencyResultValue');
        const checkModal = document.getElementById('checkModal');


        // -------------------------------------
        // وظائف المحول
        // -------------------------------------

        function populateCurrencies() {
            // مسح الخيارات القديمة
            fromCurrencySelect.innerHTML = '';
            toCurrencySelect.innerHTML = '';
            
            // إضافة الخيارات الجديدة
            for (const code in exchangeRates) {
                const name = currencyNames[code] || code;

                const fromOption = document.createElement('option');
                fromOption.value = code;
                fromOption.textContent = name;
                fromCurrencySelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = code;
                toOption.textContent = name;
                toCurrencySelect.appendChild(toOption);
            }
            
            // تعيين القيم الافتراضية
            fromCurrencySelect.value = 'USD';
            toCurrencySelect.value = 'JOD'; 
        }
        
        function swapCurrencies() {
            const temp = fromCurrencySelect.value;
            fromCurrencySelect.value = toCurrencySelect.value;
            toCurrencySelect.value = temp;
            convertCurrency(); // إعادة الحساب بعد التبديل
        }

        function convertCurrency() {
            const fromCode = fromCurrencySelect.value;
            const toCode = toCurrencySelect.value;
            let value = parseFloat(currencyInputValue.value);

            // التحقق من صحة الإدخال
            if (isNaN(value) || value < 0) {
                currencyResultValue.textContent = '0';
                return;
            }
            
            // 1. التحويل إلى الدولار (العملة المرجعية)
            const valueInUSD = value / exchangeRates[fromCode];
            
            // 2. التحويل من الدولار إلى العملة المطلوبة
            const finalResult = valueInUSD * exchangeRates[toCode];

            currencyResultValue.textContent = finalResult.toFixed(4);
        }

        // -------------------------------------
        // وظائف الـ Modal
        // -------------------------------------

        function openCheckModal() {
            checkModal.style.display = 'flex';
        }

        function closeCheckModal() {
            checkModal.style.display = 'none';
        }

        // تهيئة محول العملات عند تحميل الصفحة
        window.onload = function() {
            populateCurrencies(); 
            openCheckModal(); 
        };
    </script>
</body>
</html>
