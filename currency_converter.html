<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات - ليث</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ------------------------------------- */
        /* التنسيقات العامة (مأخوذة من الكود الأصلي) */
        /* ------------------------------------- */

        /* يفترض أن هذه التنسيقات تأتي من styles.css، لكن سنضيف التنسيقات الإضافية هنا */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f5;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        .main-header {
            width: 100%;
            background-color: #1a1a2e; /* افتراض لون ثابت لشريط العنوان */
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        /* تنسيقات محول العملات الأساسية */
        .unit-converter-container {
            display: none; 
            max-width: 500px;
            width: 90%;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .converter-input, .converter-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0056b3;
        }
        
        /* ------------------------------------- */
        /* تنسيقات النوافذ المنبثقة (Modal) */
        /* ------------------------------------- */
        .modal-overlay {
            display: flex; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        
        .modal-box p {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .modal-button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            text-decoration: none; /* لضمان تنسيق جيد */
            display: inline-block;
        }

        /* زر "أه" */
        .button-yes {
            background-color: #28a745; /* أخضر */
            color: white;
        }
        .button-yes:hover {
            background-color: #1e7e34;
        }

        /* زر "لا" */
        .button-no {
            background-color: #dc3545; /* أحمر */
            color: white;
        }
        .button-no:hover {
            background-color: #c82333;
        }
        
        /* زر "أكمل" (للنافذة الإيجابية) */
        .button-continue { 
            background-color: #007bff;
            color: white;
            width: 100%;
        }
        .button-continue:hover {
            background-color: #0056b3;
        }
        
        /* **التعديل الجديد:** زر العودة للقائمة (للنافذة السلبية) */
        .button-return-home {
            background-color: #007bff; /* أزرق موحد */
            color: white;
            width: 100%;
            padding: 12px 0; /* لجعله مشابهاً في الحجم لـ "أكمل" */
        }
        .button-return-home:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body onload="openCheckModal()">
    <header class="main-header">
        <h1>💰 محول العملات</h1>
    </header>

    <div id="checkModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <p>أستاذ بدك تحطلي فل ؟؟</p>
            <div class="button-group">
                <button class="modal-button button-yes" onclick="showAffirmativeModal()">أه</button>
                <button class="modal-button button-no" onclick="showNegativeModal()">لا</button>
            </div>
        </div>
    </div>
    
    <div id="affirmativeModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <p style="color: #28a745;">ينصر دينك</p>
            <button class="modal-button button-continue" onclick="continueToConverter()">أكمل</button>
        </div>
    </div>
    
    <div id="negativeModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <p style="color: #dc3545;">إذا هيك مش مكمل</p>
            <button class="modal-button button-return-home" onclick="returnToHome()">العودة للقائمة الرئيسية</button>
        </div>
    </div>
    <div class="container unit-converter-container" id="converterContainer">
        <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>
        
        <label for="currencyInputValue" style="font-weight: bold; margin-bottom: 5px;">المبلغ المراد تحويله:</label>
        <input type="number" id="currencyInputValue" value="100" placeholder="أدخل المبلغ" class="converter-input" oninput="convertCurrency()">

        <label for="fromCurrency" style="font-weight: bold; margin-top: 15px; margin-bottom: 5px;">من عملة:</label>
        <select id="fromCurrency" class="converter-select" onchange="convertCurrency()"></select>
        
        <label for="toCurrency" style="font-weight: bold; margin-top: 15px; margin-bottom: 5px;">إلى عملة:</label>
        <select id="toCurrency" class="converter-select" onchange="convertCurrency()"></select>

        <div class="result-box">
            <label style="font-weight: bold;">النتيجة:</label>
            <span id="currencyResultValue">0</span>
        </div>
        
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; font-weight: bold; color: #dc3545;">
    ⚠️ **ملاحظة هامة:** هذه الأسعار **تقريبية وثابتة** ولا تمثل أسعار الصرف الحقيقية اللحظية.
    </p>
    </div>

    <script>
        const exchangeRates = {
            // الأسعار بالنسبة للدولار الأمريكي (USD = 1) - أسعار تقريبية وثابتة (من الكود الأصلي)
            "USD": 1, "EUR": 0.93, "GBP": 0.81, "JPY": 150.00, "CAD": 1.36, "AUD": 1.55, "CHF": 0.91,
            "CNY": 7.20, "INR": 83.00, "BRL": 5.15, "ZAR": 18.50, "RUB": 92.50, "SAR": 3.75,
            "AED": 3.67, "KWD": 0.31, "QAR": 3.64, "OMR": 0.38, "BHD": 0.38, "JOD": 0.71,
            "EGP": 30.85, "DZD": 135.00, "LYD": 4.80, "TND": 3.10, "MAD": 10.02, "SYP": 13500,
            "IQD": 1310, "YER": 250.00, "SEK": 10.90, "NOK": 10.60, "DKK": 6.90, "PLN": 4.05,
            "HUF": 360.00, "CZK": 23.00, "KRW": 1380.00, "IDR": 16000.00, "MYR": 4.70,
            "THB": 36.50, "PHP": 58.00, "HKD": 7.80, "SGD": 1.36, "MXN": 17.50, "ARS": 870.00,
            "CLP": 950.00, "NGN": 1500.00, "KES": 130.00, "NZD": 1.68, "TRY": 32.00
        };

        const currencyDisplayNames = {
            // أسماء العملات (من الكود الأصلي)
            "USD": "دولار أمريكي (USD)", "EUR": "يورو (EUR)", "GBP": "جنيه استرليني (GBP)",
            "JPY": "ين ياباني (JPY)", "CAD": "دولار كندي (CAD)", "AUD": "دولار أسترالي (AUD)",
            "CHF": "فرنك سويسري (CHF)", "CNY": "يوان صيني (CNY)", "INR": "روبية هندية (INR)",
            "BRL": "ريال برازيلي (BRL)", "ZAR": "راند جنوب أفريقي (ZAR)", "RUB": "روبل روسي (RUB)",
            "SAR": "ريال سعودي (SAR)", "AED": "درهم إماراتي (AED)", "KWD": "دينار كويتي (KWD)",
            "QAR": "ريال قطري (QAR)", "OMR": "ريال عماني (OMR)", "BHD": "دينار بحريني (BHD)",
            "JOD": "دينار أردني (JOD)", "EGP": "جنيه مصري (EGP)", "DZD": "دينار جزائري (DZD)",
            "LYD": "دينار ليبي (LYD)", "TND": "دينار تونسي (TND)", "MAD": "درهم مغربي (MAD)",
            "SYP": "ليرة سورية (SYP)", "IQD": "دينار عراقي (IQD)", "YER": "ريال يمني (YER)",
            "SEK": "كرونة سويدية (SEK)", "NOK": "كرونة نرويجية (NOK)", "DKK": "كرونة دنماركية (DKK)",
            "PLN": "زلوتي بولندي (PLN)", "HUF": "فورنت هنغاري (HUF)", "CZK": "كرونة تشيكية (CZK)",
            "KRW": "وون كوري جنوبي (KRW)", "IDR": "روبية إندونيسية (IDR)", "MYR": "رينغيت ماليزي (MYR)",
            "THB": "بات تايلاندي (THB)", "PHP": "بيزو فلبيني (PHP)", "HKD": "دولار هونغ كونغ (HKD)",
            "SGD": "دولار سنغافوري (SGD)", "MXN": "بيزو مكسيكي (MXN)", "ARS": "بيزو أرجنتيني (ARS)",
            "CLP": "بيزو تشيلي (CLP)", "NGN": "نايرا نيجيري (NGN)", "KES": "شلن كيني (KES)",
            "NZD": "دولار نيوزيلندي (NZD)", "TRY": "ليرة تركية (TRY)"
        };

        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const currencyInputValue = document.getElementById('currencyInputValue');
        const currencyResultValue = document.getElementById('currencyResultValue');
        
        // *************** متغيرات النوافذ المنبثقة ***************
        const checkModal = document.getElementById('checkModal');
        const affirmativeModal = document.getElementById('affirmativeModal');
        const negativeModal = document.getElementById('negativeModal');
        const converterContainer = document.getElementById('converterContainer');


        // *************** وظائف النوافذ المنبثقة والتحكم ***************

        function openCheckModal() {
            checkModal.style.display = 'flex';
        }

        function showAffirmativeModal() {
            checkModal.style.display = 'none'; // إخفاء الأولى
            affirmativeModal.style.display = 'flex'; // إظهار ينصر دينك
        }

        function showNegativeModal() {
            checkModal.style.display = 'none'; // إخفاء الأولى
            negativeModal.style.display = 'flex'; // إظهار مش مكمل
        }
        
        function continueToConverter() {
            affirmativeModal.style.display = 'none'; // إخفاء ينصر دينك
            converterContainer.style.display = 'block'; // إظهار المحول
            populateCurrencies(); // تهيئة المحول
            convertCurrency(); // تشغيل الحساب الافتراضي
        }

        function returnToHome() {
            // توجيه المستخدم للقائمة الرئيسية
            window.location.href = 'index.html';
        }


        // *************** وظائف المحول الأصلية ***************

        function populateCurrencies() {
            fromCurrencySelect.innerHTML = '';
            toCurrencySelect.innerHTML = '';

            for (const code in exchangeRates) {
                const name = currencyDisplayNames[code] || code;
                
                const fromOption = document.createElement('option');
                fromOption.value = code;
                fromOption.textContent = name;
                fromCurrencySelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = code;
                toOption.textContent = name;
                toCurrencySelect.appendChild(toOption);
            }
            
            // تعيين القيم الافتراضية
            fromCurrencySelect.value = 'USD';
            toCurrencySelect.value = 'SAR';
        }

        function convertCurrency() {
            const fromCode = fromCurrencySelect.value;
            const toCode = toCurrencySelect.value;
            let value = parseFloat(currencyInputValue.value);

            if (isNaN(value) || value < 0) {
                currencyResultValue.textContent = '0';
                return;
            }
            
            const valueInUSD = value / exchangeRates[fromCode];
            const finalResult = valueInUSD * exchangeRates[toCode];

            currencyResultValue.textContent = finalResult.toFixed(4);
        }

        // تهيئة محول العملات عند تحميل الصفحة
        window.onload = function() {
            // لا نستخدم populateCurrencies هنا، بل نفتح النافذة
            openCheckModal(); 
        };
    </script>
</body>
</html>
