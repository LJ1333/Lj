<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع ليث الربايعة</title>
    <style>
        /* ------------------------------------- */
        /* التنسيقات العامة */
        /* ------------------------------------- */
        :root {
            --primary-color: #007bff;        /* أزرق ساطع */
            --header-bg-color: #1a1a2e;       /* لون خلفية الشريط العلوي (داكن عميق) */
            --header-text-color: #ffffff;    /* لون نص الشريط العلوي */
            --background-light: #f4f4f9;     /* خلفية فاتحة */
            --container-bg: #ffffff;         /* خلفية الحاوية */
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.5); 
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 30px;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        /* ------------------------------------- */
        /* تنسيقات الأزرار (القائمة) */
        /* ------------------------------------- */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px; /* مسافة بين الأزرار */
        }

        .nav-button {
            flex-grow: 1;
            padding: 25px 15px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        /* ألوان الأزرار المخصصة */

        /* الآلة الحاسبة: أزرق */
        .calculator-button {
            background-color: #007bff; 
        }
        .calculator-button:hover {
            background-color: #0056b3;
        }

        /* حاسبة معدل التوجيهي: تركواز */
        .tawjihi-button {
            background-color: #00bcd4; 
        }
        .tawjihi-button:hover {
            background-color: #0097a7;
        }

        /* محول العملات: أخضر / ذهبي */
        .currency-button {
            background-color: #ff9800; /* برتقالي/ذهبي */
        }
        .currency-button:hover {
            background-color: #f57c00;
        }

        /* محول القياسات: بنفسجي */
        .converter-button {
            background-color: #9c27b0; 
        }
        .converter-button:hover {
            background-color: #7b1fa2;
        }
        
        /* 💡 تنسيق زر الذكاء الاصطناعي الجديد (مُضاف) */
        .ai-button {
            background-color: #28a745; /* أخضر زمردي جذاب - يطابق اللون في styles.css */
        }
        .ai-button:hover {
            background-color: #1e7e34;
        }

        /* تنسيق الاستجابة للشاشات الصغيرة */
        @media (max-width: 600px) {
            .button-group {
                flex-direction: column; /* جعل الأزرار تأتي فوق بعضها */
            }
            .nav-button {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="main-header">
        <h1>مشروع ليث الربايعة</h1>
    </div>

    <div class="container">
        <p style="font-size: 1.3rem; font-weight: 600; text-align: center; color: var(--primary-color); margin-bottom: 30px;">
            ⭐ اختر الخدمة التي تريد استخدامها ⭐
        </p>
        
        <div class="button-group">
            <a href="calculator.html" class="nav-button calculator-button">
                🔢 الآلة الحاسبة
            </a>
            <a href="tawjihi_calculator.html" class="nav-button tawjihi-button">
                📊 حاسبة معدل التوجيهي
            </a>
        </div>

        <div class="button-group">
            <a href="currency_converter.html" class="nav-button currency-button">
                💰 محول العملات
            </a>
            <a href="unit_converter.html" class="nav-button converter-button">
                📐 محول القياسات
            </a>
        </div>
        
        <div class="button-group">
            <a href="ai_chat.html" class="nav-button ai-button">
                🤖 محادثة الذكاء الاصطناعي
            </a>
        </div>
        
    </div>
</body>
</html>
