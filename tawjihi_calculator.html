<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة معدل التوجيهي - ليث</title>
    <style>
        /* ------------------------------------- */
        /* 1. التنسيقات العامة (يفترض أنها من styles.css) */
        /* ------------------------------------- */

        /* المتغيرات (Variables) - افتراضية */
        :root {
            --primary-color: #007bff;        /* أزرق ساطع */
            --secondary-color: #00838f;      /* تركواز داكن للحاسبة */
            --background-light: #f8f9fa;     /* خلفية فاتحة جداً */
            --text-dark: #343a40;            /* نص داكن */
            --header-bg-color: #1a1a2e;       /* لون خلفية الشريط العلوي (داكن عميق) */
            --header-text-color: #ffffff;    /* لون نص الشريط العلوي */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center center; 
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 
                         0 0 10px rgba(0, 123, 255, 0.5); 
            color: #fff; 
        }

        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
            display: block; 
            text-align: right;
        }
        .back-link:hover {
            color: #0056b3; 
        }

        /* حاوية المحتوى الرئيسي */
        .container {
            max-width: 600px;
            width: 90%;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        
        /* ------------------------------------- */
        /* 2. التنسيقات الخاصة بالحاسبة */
        /* ------------------------------------- */

        /* التنسيقات العامة للحقول */
        .subject-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .subject-label {
            flex-grow: 1;
            font-weight: bold;
            color: #333;
        }
        .subject-input {
            width: 120px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 1.1rem;
        }
        .calculate-button {
            width: 100%;
            padding: 15px;
            background-color: var(--secondary-color); /* #00838f */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s;
        }
        .calculate-button:hover {
            background-color: #005f6b;
        }

        /* ------------------------------------- */
        /* 3. التنسيقات الجديدة للنافذة المنبثقة (Modal-like) */
        /* ------------------------------------- */

        /* الطبقة التي تغطي الشاشة (تعتيم) */
        .modal-overlay {
            display: none; /* إخفاء افتراضيًا */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* تعتيم */
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        /* صندوق النتائج في المنتصف (لنتيجة المعدل) */
        .result-box-tawjihi {
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background-color: white;
            border: 5px solid var(--secondary-color); /* #00838f */
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* تنسيقات النجاح والرسوب */
        .pass-message {
            color: #28a745; 
            font-weight: bold;
            font-size: 1.8rem;
            margin-top: 15px;
        }
        .fail-message {
            color: #dc3545; 
            font-weight: bold;
            font-size: 1.8rem;
            margin-top: 15px;
        }
        
        /* زر الإغلاق */
        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #888;
        }
        
        /* محتوى الحاسبة سيكون مرئياً دائماً */
        .calculator-content {
            display: block; 
            width: 90%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <h1>📊 حاسبة معدل التوجيهي (السنة الأولى - 30%)</h1>
    </header>

    <div id="calculatorContent" class="container calculator-content">
        <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>
        
        <p style="text-align: center; color: #555; margin-bottom: 30px;">
            أدخل علامتك النهائية لكل مادة. سيتم احتساب معدلك التراكمي للسنة الأولى (من 30%).
        </p>

        <div class="subject-container">
            <label for="arabic" class="subject-label">اللغة العربية (العلامة القصوى 100):</label>
            <input type="number" id="arabic" class="subject-input" min="0" max="100">
        </div>
        
        <div class="subject-container">
            <label for="english" class="subject-label">اللغة الإنجليزية (العلامة القصوى 100):</label>
            <input type="number" id="english" class="subject-input" min="0" max="100">
        </div>

        <div class="subject-container">
            <label for="islamic" class="subject-label">التربية الإسلامية (العلامة القصوى 60):</label>
            <input type="number" id="islamic" class="subject-input" min="0" max="60">
        </div>

        <div class="subject-container">
            <label for="history" class="subject-label">تاريخ الأردن (العلامة القصوى 40):</label>
            <input type="number" id="history" class="subject-input" min="0" max="40">
        </div>
        
        <button class="calculate-button" onclick="calculateTawjihi()">
            احسب المعدل والنتيجة
        </button>
    </div>
    
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
        <div class="result-box-tawjihi" onclick="event.stopPropagation()">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2>المعدل التراكمي للسنة الأولى (من 30):</h2>
            <span id="tawjihiResult" style="font-size: 2.5em; font-weight: bold; color: #00838f;">--</span>
            <p id="passFailMessage" style="margin-top: 20px;"></p>
        </div>
    </div>


    <script>
        // الأوزان والعلامات القصوى للمواد
        const subjectInputs = [
            // (المواد الـ 4 التي يتم احتسابها من 30% هنا)
            { id: 'arabic', maxMark: 100, weight: 4 }, 
            { id: 'english', maxMark: 100, weight: 4 }, 
            { id: 'islamic', maxMark: 60, weight: 3 }, 
            { id: 'history', maxMark: 40, weight: 3 } 
        ];
        
        const resultElement = document.getElementById('tawjihiResult');
        const passFailMessage = document.getElementById('passFailMessage');
        const resultModal = document.getElementById('modalOverlay'); 

        // *************** وظائف الحساب الأصلية ***************

        function calculateTawjihi() {
            let totalWeightedMarks = 0; 
            let totalUnits = 0;        
            let allMarksEntered = true; 

            // إعادة تعيين حالة الحقول
            subjectInputs.forEach(sub => {
                document.getElementById(sub.id).style.border = '1px solid #ccc';
            });
            
            for (const subject of subjectInputs) {
                const inputElement = document.getElementById(subject.id);
                let mark = parseFloat(inputElement.value);

                // التحقق من صحة العلامة
                if (isNaN(mark) || mark < 0 || mark > subject.maxMark) {
                    allMarksEntered = false;
                    inputElement.style.border = '2px solid #dc3545'; // تظليل الحقل الخاطئ
                } else {
                    // تحويل العلامة إلى نظام الـ 100
                    const markOutOf100 = (mark / subject.maxMark) * 100;
                    
                    // الحساب الموزون
                    totalWeightedMarks += markOutOf100 * subject.weight;
                    totalUnits += subject.weight;
                }
            }

            if (!allMarksEntered) {
                resultElement.textContent = 'خطأ';
                passFailMessage.textContent = 'الرجاء إدخال جميع العلامات بشكل صحيح وضمن الحد الأقصى.';
                passFailMessage.className = 'fail-message';
                resultModal.style.display = 'flex'; 
                return;
            }

            // 1. حساب المعدل الكلي من 100%
            const overallAverage = totalWeightedMarks / totalUnits;
            
            // 2. حساب مساهمة السنة الأولى (30%)
            const finalContribution = (overallAverage * 30) / 100;
            const finalResult = finalContribution.toFixed(2);

            resultElement.textContent = finalResult;
            
            // 3. قرار النجاح والرسوب 
            // يفترض أن النجاح يبدأ من 50% من العلامة الكلية (أي 15 من 30)
            if (finalContribution >= 15) { 
                passFailMessage.innerHTML = `مـبـروكككك نجحت! 🎉<br>تقديرك هو **${finalResult}** من 30.`;
                passFailMessage.className = 'pass-message';
            } else {
                // رسالة الرسوب
                passFailMessage.innerHTML = `راسب يا فاشل. 😞<br>تقديرك هو **${finalResult}** من 30.`;
                passFailMessage.className = 'fail-message';
            }
            
            // 4. إظهار نافذة النتائج
            resultModal.style.display = 'flex';
        }

        function closeModal() {
            resultModal.style.display = 'none';
        }
        
    </script>
</body>
</html>
